name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  publish:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - runtime: win-x64
            framework: net10.0-windows
          - runtime: linux-x64
            framework: net10.0

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Restore dependencies
      run: dotnet restore ./csproj/FakeMessenger.csproj -r ${{ matrix.runtime }}

    - name: Publish application
      run: >
        dotnet publish ./csproj/FakeMessenger.csproj
        -c Release
        -f ${{ matrix.framework }}
        -r ${{ matrix.runtime }}
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o ./publish/${{ matrix.runtime }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-app-${{ matrix.runtime }}
        path: ./publish/${{ matrix.runtime }}/