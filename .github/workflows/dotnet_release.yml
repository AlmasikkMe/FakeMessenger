name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (тег, например v1.0.0)'
        required: true
        type: string
      release_title:
        description: 'Заголовок релиза'
        required: true
        type: string
      release_notes:
        description: 'Описание релиза (что нового)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # нужно для скачивания артефактов из других workflow

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. Узнаём ID последнего успешного запуска dotnet_desktop.yml на master
      - name: Get last successful run of dotnet_desktop.yml
        id: last_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow dotnet_desktop.yml \
            --branch master \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Last successful run ID: $RUN_ID"

      # 2. Скачиваем артефакты из этого запуска
      - name: Download artifacts from last run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ steps.last_run.outputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir artifacts
          find artifacts -type f -exec ls -lh {} \;

      # 3. Собираем все файлы в одну папку (артефакты распаковываются в подпапки)
      - name: Flatten
        run: |
          mkdir release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -lh release-files

      # 4. Создаём релиз
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_title }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          files: release-files/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
